  <style>
    #ts-compact-icon-review { max-width: 760px; margin: 0 auto; padding: 16px; color: light-dark(#20242a, #e9edf1); font: 14px/1.45 system-ui, sans-serif; }

    #ts-compact-icon-review .ic-stage { display: flex; align-items: flex-start; justify-content: center; padding: 12px 0 24px; }
    #ts-compact-icon-review .ic-sheet { --ic-bg: light-dark(#f4f5f6, #171a1f); --ic-surface: light-dark(#ffffff, #20252b); --ic-ink: light-dark(#20242a, #e9edf1); --ic-muted: light-dark(#59616b, #acb4bf); --ic-line: light-dark(#d8dde3, #3c434d); --ic-accent: #c18b57; --ic-width: 440px; --ic-font: 14px; width: min(100%, var(--ic-width)); min-width: 0; color: var(--ic-ink); background: var(--ic-bg); border: 1px solid var(--ic-line); border-radius: 8px; font: var(--ic-font)/1.45 system-ui, sans-serif; overflow-wrap: anywhere; container-type: inline-size; }
    #ts-compact-icon-review .ic-sheet * { box-sizing: border-box; }
    #ts-compact-icon-review .ic-sheet h2, #ts-compact-icon-review .ic-sheet h3, #ts-compact-icon-review .ic-sheet p, #ts-compact-icon-review .ic-sheet dl { margin: 0; }
    #ts-compact-icon-review .ic-sheet h2 { font: 650 21px/1.25 system-ui, sans-serif; letter-spacing: -.3px; }
    #ts-compact-icon-review .ic-sheet h3 { font-size: 14px; font-weight: 650; }
    #ts-compact-icon-review .ic-sheet button { font: inherit; color: inherit; background: transparent; border: 0; min-width: 0; }
    #ts-compact-icon-review .ic-sheet svg, #ts-compact-icon-review .ic-sheet [data-lucide] { width: 18px; height: 18px; display: inline-block; flex: 0 0 auto; color: var(--ic-muted); }
    #ts-compact-icon-review .ic-sheet[data-glyphs="false"] svg, #ts-compact-icon-review .ic-sheet[data-glyphs="false"] [data-lucide] { display: none; }
    #ts-compact-icon-review .ic-chrome { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--ic-line); padding: 10px 16px; color: var(--ic-muted); font-size: 12px; }
    #ts-compact-icon-review .ic-main { display: grid; gap: 18px; padding: 18px 16px; }
    #ts-compact-icon-review .ic-person { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
    #ts-compact-icon-review .ic-sheet .ic-identity select { padding: 0 22px 0 0; border: 0; background: transparent; font-size: 21px; font-weight: 650; color: var(--ic-ink); }
    #ts-compact-icon-review .ic-identity { display: grid; gap: 3px; min-width: 0; }
    #ts-compact-icon-review .ic-person-actions { display: flex; align-items: center; gap: 5px; }
    #ts-compact-icon-review .ic-sheet .ic-person-menu { position: relative; border: 0; padding: 0; }
    #ts-compact-icon-review .ic-person-menu > summary { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; list-style: none; border: 1px solid var(--ic-line); border-radius: 5px; background: var(--ic-surface); }
    #ts-compact-icon-review .ic-person-menu > summary::-webkit-details-marker { display: none; }

        #ts-compact-icon-review .ic-sheet .ic-inspiration { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--ic-line); border-radius: 5px; background: var(--ic-surface); }

      // Synthetic preview only. Production must derive the same plan from shared commands.
      function demoRecoveryPlan(character,kind,selectedSlots={}){
        const next=structuredClone(character),changes=[],notes=[];
        const record=(label,before,after)=>{if(before!==after)changes.push({label,before,after});};
        let valid=true,cost=0;
        if(kind==='arcane'){
          for(const [level,slot]of Object.entries(character.slots)){
            const quantity=Number(selectedSlots['slot-'+level]??0);
            if(!Number.isInteger(quantity)||quantity<0||quantity>slot.used){valid=false;continue;}
            if(Number(level)>5){if(quantity)valid=false;continue;}
            cost+=Number(level)*quantity;next.slots[level].used-=quantity;
          }
          valid=valid&&character.klass==='Mago'&&character.resource.used<character.resource.max&&cost>0&&cost<=Math.ceil(character.level/2);
          next.resource.used=Math.min(next.resource.max,next.resource.used+1);
        }else{
          if(kind==='long'){
            next.hp=next.max;next.temp=0;next.deathSuccess=0;next.deathFailure=0;
            next.hitDice.remaining=Math.min(next.hitDice.max,next.hitDice.remaining+Math.max(1,Math.floor(next.hitDice.max/2)));
            next.traits.forEach(trait=>trait.used=0);
          }else notes.push('Curación con dados de golpe: requiere elegir los dados y resolver la curación.');
          if(kind==='long'||character.klass!=='Mago')next.resource.used=0;
          if(kind==='long'||character.klass==='Brujo')Object.values(next.slots).forEach(slot=>slot.used=0);
          if(kind==='short'&&character.klass==='Mago'&&character.resource.used<character.resource.max)notes.push('Recuperación arcana disponible: sus espacios se eligen por separado.');
        }
        record('PG',character.hp,next.hp);record('PG temporales',character.temp,next.temp);
        record('Dados de golpe disponibles',character.hitDice.remaining,next.hitDice.remaining);
        record(character.resource.name+' · usos',character.resource.max-character.resource.used,next.resource.max-next.resource.used);
        for(const [level,slot]of Object.entries(character.slots))record('Espacios N'+level+' disponibles',slot.max-slot.used,next.slots[level].max-next.slots[level].used);
        character.traits.forEach((trait,i)=>record(trait.name+' · usos',trait.max-trait.used,next.traits[i].max-next.traits[i].used));
        record('Salvaciones de muerte · éxitos',character.deathSuccess??0,next.deathSuccess??0);
        record('Salvaciones de muerte · fallos',character.deathFailure??0,next.deathFailure??0);
        return {next,changes,notes,valid,cost};
      }

        if(action==='merchant-mode'){ui.merchantMode=key;ui.cart={};return;}
        if(action==='merchant-state'){mutate('Estado del comerciante actualizado',()=>data.merchant.state=key);ui.cart={};return;}
        if(action==='merchant-barter'){mutate('Comercio actualizado',()=>data.merchant.barter=!data.merchant.barter);ui.cart={};return;}
        if(action==='cart-add'||action==='cart-remove'){const list=ui.merchantMode==='buy'?data.merchant.stock:c.inventory;const item=list.find(i=>i.id===key);if(item)ui.cart[key]=Math.max(0,Math.min(item.quantity,(ui.cart[key]??0)+(action==='cart-add'?1:-1)));return;}
        if(action==='trade'||action==='merchant-loot'){const buy=ui.merchantMode==='buy',m=data.merchant;const source=buy?m.stock:c.inventory,target=buy?c.inventory:m.stock;const entries=Object.entries(ui.cart).filter(([,q])=>q>0);const total=entries.reduce((sum,[id,q])=>sum+(source.find(i=>i.id===id)?.price??0)*q,0);if(action==='trade'&&(!m.barter||m.state!=='active'||(buy?c.copper:m.copper)<total))throw new Error('El intercambio no está disponible o faltan monedas.');if(action==='merchant-loot'&&(m.state==='active'||!m.loot||!buy))throw new Error('El saqueo no está habilitado.');if(!entries.length)throw new Error('Elegí objetos primero.');if(entries.some(([id,q])=>{const item=source.find(i=>i.id===id);return !item||!Number.isInteger(q)||q>item.quantity;}))throw new Error('Cambió la disponibilidad. Revisá las cantidades.');mutate(action==='trade'?'Intercambio de ejemplo confirmado':'Saqueo de ejemplo confirmado',()=>{for(const [id,q]of entries){const item=source.find(i=>i.id===id);item.quantity-=q;target.push({...structuredClone(item),id:uid('item'),quantity:q,equipped:false,attuned:false});}if(action==='trade'){c.copper+=buy?-total:total;m.copper+=buy?total:-total;}});ui.cart={};ui.dialog=null;return;}
        if(action==='merchant-challenge'){open('info',key+' · revisión',{body:'Seleccionar objeto, revisar dificultad y resolver una prueba. Resultado ilustrativo: 17. La resolución y el permiso deben confirmarse antes de transferir.'});return;}
        if(action==='check'){mutate('Checklist actualizada',()=>data.checklist[Number(key)].done=!data.checklist[Number(key)].done);return;}
        if(action==='tool-roll'){notify('Tabla de ejemplo · resultado 3: ruinas en el camino.');return;}
        if(action==='tool-npc'){open('info','NPC de ejemplo',{body:'Arlen · cartógrafo. Lleva una capa gastada y busca un mapa perdido.'});return;}
        throw new Error('Control sin recorrido de ejemplo: '+action);
      }
      function submit(form,hpOperation) {
        const values=Object.fromEntries(new FormData(form));const kind=form.dataset.form,c=char();const num=(key,min=0)=>{const value=Number(values[key]);if(!Number.isInteger(value)||value<min)throw new Error('Revisá el campo '+key+'.');return value;};const name=()=>{const value=String(values.name??'').trim();if(!value)throw new Error('Ingresá un nombre o título.');return value;};
        if(readOnly()&&!['travel','login','report','invite'].includes(kind))throw new Error('Este estado es de solo lectura.');
        if(kind==='builder'){Object.assign(ui.draft,values);if(ui.builderStep===0){name();if(num('level',1)>20)throw new Error('El nivel de ejemplo debe estar entre 1 y 20.');}if(ui.builderStep<4){ui.builderStep++;return;}const draft=ui.draft;mutate('Personaje de ejemplo creado',()=>{const id=uid('character');const created=makeCharacter(id,draft.name,draft.klass,Number(draft.level),12,12);created.scores=abilities.map(a=>Number(draft[a.id]??10));data.characters[id]=created;ui.character=id;});ui.dialog=null;route('summary');return;}
        if(kind==='experience'){if(c.hp<=0)throw new Error('Con 0 PG no se modifica experiencia.');const amount=num('amount',1);mutate('Experiencia agregada',()=>c.experience=(c.experience??0)+amount);return;}if(c.hp<=0&&kind!=='hp')throw new Error('Con 0 PG solo podés curar o gestionar salvaciones.');if(kind==='hp'){if(c.hp<=0&&ui.dialog.kind==='hp'&&hpOperation!=='heal')throw new Error('Con 0 PG solo podés curar.');if(!['heal','damage','temp'].includes(hpOperation))throw new Error('Elegí una operación.');const target=ui.dialog.kind==='actor-hp'?actor():c;const amount=num('amount',1);mutate('PG del ejemplo actualizados',()=>{if(hpOperation==='damage')damage(target,amount);else if(hpOperation==='heal'){target.hp=Math.min(target.max,target.hp+amount);target.deathSuccess=0;target.deathFailure=0;}else target.temp=Math.max(target.temp,amount);});}
        if(kind==='character-color'){const color=String(values.characterColor);if(!/^#[0-9a-f]{6}$/i.test(color))throw new Error('Color inválido.');mutate('Color del personaje guardado',()=>c.color=color);return;}
        if(kind==='cast'){const s=c.spells.find(x=>x.id===ui.dialog.id);if(values.slot!=='ritual'&&Number(values.slot)>0){const slot=c.slots[values.slot];if(!slot||slot.used>=slot.max)throw new Error('No hay espacios disponibles en ese nivel.');}mutate('Conjuro lanzado en el ejemplo',()=>{if(values.slot!=='ritual'&&Number(values.slot)>0)c.slots[values.slot].used++;if(s.concentration&&!c.conditions.includes('Concentración'))c.conditions.push('Concentración');});}
        if(kind==='arcane'){const plan=demoRecoveryPlan(c,'arcane',values);if(!plan.valid)throw new Error('Revisá los espacios elegidos.');mutate('Recuperación arcana de ejemplo aplicada',()=>data.characters[c.id]=plan.next);}
        if(kind==='currency'){const amount=num('amount',1)*num('coin',1);if(values.operation==='remove'&&amount>c.copper)throw new Error('No hay suficientes monedas.');mutate('Monedas actualizadas',()=>c.copper+=values.operation==='remove'?-amount:amount);}
        if(kind==='transfer'){const item=c.inventory.find(i=>i.id===ui.dialog.id),amount=num('amount',1),target=data.characters[values.target];if(!target||target.id===c.id||amount>item.quantity)throw new Error('Revisá destinatario y cantidad.');mutate('Objeto transferido en el ejemplo',()=>{item.quantity-=amount;target.inventory.push({...structuredClone(item),id:uid('item'),quantity:amount,equipped:false,attuned:false});});}
        if(kind==='character-edit'){const title=name(),max=num('max',1),ac=num('ac');const scores=abilities.map(a=>num(a.id,1));mutate('Ficha de ejemplo guardada',()=>{Object.assign(c,{name:title,...Object.fromEntries(['species','subrace','klass','subclass','background','alignment'].map(key=>[key,String(values[key]??'')])),max,ac,scores});c.hp=Math.min(c.hp,max);});}
        if(kind==='level'){const hp=num('hp',1);mutate('Nivel de ejemplo confirmado',()=>{c.level++;c.max+=hp;});}
        if(kind==='note'){const title=name();mutate('Nota guardada',()=>{const notes=ui.role==='gm'?data.gmNotes:c.notes;const old=notes.find(n=>n.id===ui.dialog.id);if(old)Object.assign(old,{name:title,body:String(values.body)});else notes.push({id:uid('note'),name:title,body:String(values.body)});});}
        if(kind==='entity'){const title=name();mutate('Contenido guardado',()=>{const entries=data.catalog[ui.content],old=entries.find(e=>e.id===ui.dialog.id);const value={...values,name:title};if(old)Object.assign(old,value);else entries.push({...value,id:uid('entity')});});}
        if(kind==='assignment')mutate('Asignación guardada',()=>Object.assign(data.characters[ui.dialog.id],{player:String(values.player),miniature:String(values.miniature)}));
        if(kind==='association')mutate('Asociación de ejemplo guardada',()=>{actor().associated=true;actor().name=String(values.name)||'Perfil asociado';});
        if(kind==='monster-edit'){const title=name(),max=num('max',1),ac=num('ac');mutate('Criatura actualizada',()=>{Object.assign(actor(),{name:title,max,ac});actor().hp=Math.min(actor().hp,max);});}
        if(kind==='travel'){notify('Viaje de ejemplo preparado: '+num('distance',1)+' millas · ritmo '+values.pace+'.');return;}
        if(kind==='login'){ui.role='player';route('summary');notify('Acceso de ejemplo completado, sin autenticar.');return;}
        if(kind==='report')notify('Informe simulado. No se envió ningún mensaje.');
        if(kind==='invite')notify('Invitación simulada para '+values.email+'. No se envió correo.');
        ui.dialog=null;ui.draft={};ui.error='';
      }
      function refreshAfter(action,conditionContext) {render();remember();if(action?.startsWith('open-')||ui.dialog){sheet.querySelector('.ic-dialog input, .ic-dialog select, .ic-dialog textarea, .ic-dialog button')?.focus({preventScroll:true});}else if(action){const target=[...sheet.querySelectorAll('button[data-action]')].find(b=>b.dataset.action===action&&(!conditionContext||b.dataset.conditionContext===conditionContext)&&!b.closest('[hidden]'));const fallback=conditionContext?[...sheet.querySelectorAll('.ic-conditions')].find(section=>section.dataset.conditionContext===conditionContext)?.querySelector('.ic-conditions-toggle'):null;(target??fallback)?.focus({preventScroll:true});}}
      sheet.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||!sheet.contains(b)||b.disabled)return;const [action,...parts]=b.dataset.action.split(':');try{if(b.hasAttribute('data-mutate')&&readOnly())return;execute(action,parts.join(':'),b);}catch(error){ui.toast=error.message;}refreshAfter(b.dataset.action,b.dataset.conditionContext);});
      sheet.addEventListener('submit',event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();try{submit(form,event.submitter?.value);}catch(error){ui.error=error.message;ui.toast=error.message;}refreshAfter();});
      sheet.addEventListener('input',event=>{const field=event.target;if(field.closest('.ic-dialog')&&field.name)ui.draft[field.name]=field.value;if(field.hasAttribute('data-search')){ui.query=field.value;const start=field.selectionStart;render();const replacement=sheet.querySelector('[data-search]');replacement?.focus({preventScroll:true});replacement?.setSelectionRange(start,start);}});
      sheet.addEventListener('change',event=>{const field=event.target;if(field.closest('.ic-dialog')){if(field.hasAttribute('data-rest-character')){const ids=new Set(ui.dialog.targets??[]);if(field.checked)ids.add(field.dataset.restCharacter);else ids.delete(field.dataset.restCharacter);ui.dialog.targets=[...ids];render();sheet.querySelector(`[data-rest-character="${field.dataset.restCharacter}"]`)?.focus({preventScroll:true});return;}if(field.name)ui.draft[field.name]=field.value;if(ui.dialog.kind==='arcane'){render();[...sheet.querySelectorAll('.ic-dialog select')].find(select=>select.name===field.name)?.focus({preventScroll:true});}return;}const key=field.name;if(key==='character')ui.character=field.value;if(key==='mode')ui.mode=field.value;if(key==='encounter'){ui.encounter=field.value;ui.combatant=encounter().actors[0]?.id;}if(key==='tool')ui.tool=field.value;if(key==='labels')ui.labels=field.value;if(key==='theme')ui.theme=field.value;if(key==='accent'&&/^#[0-9a-f]{6}$/i.test(field.value))ui.accent=field.value;if(key==='interface')notify('Preferencia visual de ejemplo: '+field.value+' para la próxima recarga.');render();remember();});
      sheet.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('form[data-form="hp"] input[name="amount"]'))event.preventDefault();if(event.key==='Escape'&&ui.dialog){event.preventDefault();execute('close','');render();}});
      roleControl.addEventListener('change',()=>{execute('role',roleControl.value);ui.scenario='normal';render();remember();});
      scenarioControl.addEventListener('change',()=>{ui.scenario=scenarioControl.value;ui.dialog=null;render();remember();});
      root.querySelector('#ic-review-width').addEventListener('change',event=>{ui.width=Number(event.target.value);render();remember();});
      root.querySelector('#ic-review-icons').addEventListener('change',event=>{ui.glyphs=event.target.value==='show';render();remember();});
      const tooltip=root.querySelector('#ic-local-tooltip');
      let tooltipTarget=null,tooltipTimer=null;
      function hideTooltip(){clearTimeout(tooltipTimer);tooltip.hidden=true;if(tooltipTarget){const ids=(tooltipTarget.getAttribute('aria-describedby')??'').split(/\s+/).filter(id=>id&&id!==tooltip.id);if(ids.length)tooltipTarget.setAttribute('aria-describedby',ids.join(' '));else tooltipTarget.removeAttribute('aria-describedby');}tooltipTarget=null;}
      function placeTooltip(){if(!tooltipTarget||tooltip.hidden)return;const rect=tooltipTarget.getBoundingClientRect();const width=tooltip.offsetWidth,height=tooltip.offsetHeight;tooltip.style.left=Math.max(8,Math.min(innerWidth-width-8,rect.left))+'px';tooltip.style.top=(rect.bottom+height+16<=innerHeight?rect.bottom+8:Math.max(8,rect.top-height-8))+'px';}
      function showTooltip(target){if(!target||target.disabled||target===tooltipTarget)return;hideTooltip();tooltipTarget=target;tooltip.textContent=target.dataset.tooltip;const ids=new Set((target.getAttribute('aria-describedby')??'').split(/\s+/).filter(Boolean));ids.add(tooltip.id);target.setAttribute('aria-describedby',[...ids].join(' '));tooltip.hidden=false;placeTooltip();}
      sheet.addEventListener('pointerover',event=>{const target=event.target.closest('[data-tooltip]');if(target)showTooltip(target);});
      sheet.addEventListener('pointerout',event=>{if(event.relatedTarget&&tooltipTarget?.contains(event.relatedTarget))return;tooltipTimer=setTimeout(hideTooltip,160);});
      tooltip.addEventListener('pointerenter',()=>clearTimeout(tooltipTimer));
      tooltip.addEventListener('pointerleave',()=>{tooltipTimer=setTimeout(hideTooltip,160);});
      sheet.addEventListener('focusin',event=>showTooltip(event.target.closest('[data-tooltip]')));
      sheet.addEventListener('focusout',hideTooltip);
      sheet.addEventListener('click',event=>{for(const details of sheet.querySelectorAll('.ic-xp-details[open]'))if(!details.contains(event.target))details.open=false;});
      sheet.addEventListener('toggle',event=>{if(event.target.matches('.ic-xp-details')&&event.target.open)hideTooltip();},true);
      sheet.addEventListener('keydown',event=>{const details=event.target.closest('.ic-xp-details');if(event.key==='Escape'&&details?.open){details.open=false;details.querySelector('summary').focus();hideTooltip();}});
      root.addEventListener('keydown',event=>{if(event.key==='Escape')hideTooltip();});
      window.addEventListener('scroll',placeTooltip,{passive:true});
      window.addEventListener('resize',()=>{placeTooltip();updateCompactLayouts();});
      coarsePointer.addEventListener('change',updateCompactLayouts);
      iconOptions.addEventListener('click',event=>{
        const choice=event.target.closest('button[data-icon-kind]');
        if(choice){const kind=choice.dataset.iconKind,value=choice.dataset.iconValue;if(!iconChoices[kind]?.some(option=>option.icon===value))return;previewIcons[kind]=value;renderIconChoices();render();iconOptions.querySelector(`[data-icon-kind="${kind}"][data-icon-value="${value}"]`)?.focus({preventScroll:true});}
        else if(event.target.closest('[data-icon-reset]')){Object.assign(previewIcons,approvedIcons);renderIconChoices();render();iconOptions.querySelector('[data-icon-reset]')?.focus({preventScroll:true});}
      });
      renderIconChoices();restore(window.openai?.widgetState);render();
      if(globalThis.ResizeObserver){const layoutObserver=new ResizeObserver(updateCompactLayouts);layoutObserver.observe(sheet);}
      if(globalThis.Tweak){const tweak=new Tweak({container:sheet,onChange:()=>{applyOptions();updateCompactLayouts();remember();}});tweak.addSlider(ui,'width',{label:'Ancho del panel',min:320,max:640,step:10,unit:'px'});tweak.addSlider(ui,'font',{label:'Tamaño de lectura',min:14,max:16,step:1,unit:'px'});tweak.addToggle(ui,'glyphs',{label:'Mostrar iconos'});}
      window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
    })();
  </script>
